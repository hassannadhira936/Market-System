spring.application.name=market-api
server.port=8080
# Tumia database YAKO ILIYOPO (jina la database ni lile lile la PHP: market_system au jina lako halisi).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/marketsystem?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Dar_es_Salaam}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Backend HAIUNDI wala kubadilisha tables. Hakuna JPA/Hibernate hapa.
spring.jackson.serialization.write-dates-as-timestamps=false
# BADILISHA secret hii kabla ya production (angalau herufi 32)
app.jwt-secret=${JWT_SECRET:change-this-secret-to-a-long-random-string-123456}
app.cors-origins=${CORS_ORIGINS:http://localhost:5173}
